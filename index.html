<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minecraft 工具箱</title>
<style>
:root{
  --color-primary:#7170FF;--color-primary-bg:rgba(113,112,255,0.16);
  --color-accent:#4DD0E1;--color-accent-bg:rgba(77,208,225,0.14);
  --color-bg:#0A0A0B;--color-surface:#141416;--color-surface-raised:#1C1C1F;
  --color-border:rgba(255,255,255,0.08);
  --color-text:rgba(255,255,255,0.92);--color-text-secondary:rgba(255,255,255,0.50);
  --color-text-tertiary:rgba(255,255,255,0.30);
  --color-success:#34D399;--color-success-bg:rgba(52,211,153,0.14);
  --color-warning:#FBBF24;--color-warning-bg:rgba(251,191,36,0.14);
  --color-danger:#F87171;--color-danger-bg:rgba(248,113,113,0.14);
  --font-base:system-ui,-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  --text-xs:12px;--text-sm:13px;--text-base:15px;--text-lg:18px;
  --text-xl:20px;--text-2xl:24px;--text-3xl:32px;--leading:1.6;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
  --space-6:24px;--space-8:32px;--space-12:48px;
  --radius-lg:12px;--radius-md:6px;--radius-sm:4px;--radius-pill:999px;
  --shadow-sm:0 2px 12px rgba(0,0,0,0.40);
  --shadow-md:0 8px 32px rgba(0,0,0,0.55);
  --shadow-glow:0 0 24px rgba(113,112,255,0.30);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--color-bg);color:var(--color-text);
  font-family:var(--font-base);font-size:var(--text-base);line-height:var(--leading);
  width:100%;padding:var(--space-8) var(--space-4) var(--space-12);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:920px;margin:0 auto}
header{margin-bottom:var(--space-6)}
h1{font-size:var(--text-3xl);line-height:1.2;font-weight:600}
header p{color:var(--color-text-secondary);font-size:var(--text-sm)}
.status{
  margin-top:var(--space-4);padding:var(--space-2) var(--space-3);
  border:1px solid var(--color-border);border-radius:var(--radius-md);
  background:var(--color-surface);font-size:var(--text-sm);
  color:var(--color-text-secondary);word-break:break-all;
}
.status.ok{color:var(--color-success);background:var(--color-success-bg);border-color:transparent}
.status.err{color:var(--color-danger);background:var(--color-danger-bg);border-color:transparent}
.tabs{display:flex;gap:var(--space-2);margin-bottom:var(--space-4)}
.tab{
  font-family:inherit;font-size:var(--text-sm);font-weight:500;cursor:pointer;
  padding:var(--space-2) var(--space-6);border-radius:var(--radius-pill);
  border:1px solid var(--color-border);background:transparent;color:var(--color-text-secondary);
}
.tab.on{background:var(--color-primary-bg);border-color:transparent;color:var(--color-primary)}
.panel{display:none}
.panel.on{display:block}
.bar{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-4)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
input,select{
  font-family:inherit;font-size:var(--text-base);color:var(--color-text);width:100%;
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);padding:var(--space-2) var(--space-3);outline:none;
}
input::placeholder{color:var(--color-text-secondary)}
input:focus,select:focus{border-color:var(--color-primary);box-shadow:0 0 0 2px rgba(113,112,255,0.25)}
select{
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--color-text-secondary) 50%),
                   linear-gradient(135deg,var(--color-text-secondary) 50%,transparent 50%);
  background-position:calc(100% - 18px) calc(50% + 1px),calc(100% - 13px) calc(50% + 1px);
  background-size:5px 5px;background-repeat:no-repeat;
}
select option{background:var(--color-surface-raised);color:var(--color-text)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.chip{
  font-size:var(--text-sm);font-weight:500;cursor:pointer;
  padding:var(--space-1) var(--space-3);border-radius:var(--radius-md);
  border:1px solid var(--color-border);background:rgba(255,255,255,0.06);
  color:var(--color-text-secondary);
}
.chip.on{background:var(--color-primary-bg);border-color:transparent;color:var(--color-primary)}
.btn{
  font-family:inherit;font-size:var(--text-base);font-weight:500;cursor:pointer;
  border:1px solid var(--color-border);background:transparent;color:var(--color-text);
  border-radius:var(--radius-pill);padding:var(--space-2) var(--space-6);
}
.btn:hover{border-color:rgba(255,255,255,0.16)}
.btn-primary{background:var(--color-primary);color:#fff;border-color:transparent}
.btn-primary:hover{box-shadow:var(--shadow-glow)}
.btn-sm{font-size:var(--text-sm);padding:var(--space-1) var(--space-3)}
.list{display:flex;flex-direction:column;gap:var(--space-3)}
.card{
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.card-title{font-size:var(--text-lg);font-weight:600}
.card-meta{font-size:var(--text-xs);color:var(--color-text-secondary);line-height:var(--leading)}
.tag{font-size:var(--text-xs);font-weight:500;padding:2px var(--space-2);border-radius:var(--radius-sm)}
.tag.mid{background:rgba(255,255,255,0.06);color:var(--color-text-secondary)}
.tag.acc{background:var(--color-accent-bg);color:var(--color-accent)}
.empty{padding:var(--space-8) 0;text-align:center;color:var(--color-text-secondary);font-size:var(--text-sm)}
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,0.72);display:none;
  align-items:flex-end;justify-content:center;z-index:20;padding:var(--space-4);
}
.mask.on{display:flex}
.sheet{
  width:100%;max-width:640px;max-height:82vh;overflow-y:auto;
  background:var(--color-surface-raised);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);padding:var(--space-4) var(--space-6) var(--space-6);
  box-shadow:var(--shadow-md);
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.sheet-head h2{font-size:var(--text-xl);font-weight:600;word-break:break-all}
.file{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-3);margin-bottom:var(--space-2);
  border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);
}
.file-n{font-size:var(--text-sm);word-break:break-all}
.file-s{font-size:var(--text-xs);color:var(--color-text-secondary)}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Minecraft 工具箱</h1>
    <p>Mojang 官方版本下载 · Modrinth 模组搜索</p>
    <div class="status" id="status">正在连接官方服务器…</div>
  </header>

  <div class="tabs">
    <button class="tab on" data-p="p1">游戏版本</button>
    <button class="tab" data-p="p2">模组</button>
  </div>

  <section class="panel on" id="p1">
    <div class="bar">
      <div class="chips" id="quick"></div>
      <input id="vkw" placeholder="搜版本号，例如 1.21 / 1.20.1">
      <div class="chips" id="vtypes"></div>
    </div>
    <div class="list" id="vlist"></div>
  </section>

  <section class="panel" id="p2">
    <div class="bar">
      <input id="mkw" placeholder="搜模组名称，例如 sodium / jei">
      <div class="grid2">
        <select id="mloader">
          <option value="">全部加载器</option>
          <option value="fabric">Fabric</option>
          <option value="neoforge">NeoForge</option>
          <option value="quilt">Quilt</option>
          <option value="forge">Forge</option>
        </select>
        <input id="mgame" placeholder="游戏版本，如 1.21.1">
        <select id="mcat">
          <option value="">全部类别</option>
          <option value="optimization">性能优化</option>
          <option value="library">支持库</option>
          <option value="adventure">冒险</option>
          <option value="technology">科技</option>
          <option value="magic">魔法</option>
          <option value="decoration">装饰</option>
          <option value="mobs">生物</option>
          <option value="worldgen">世界生成</option>
          <option value="storage">存储</option>
          <option value="equipment">装备</option>
          <option value="food">食物</option>
          <option value="utility">实用工具</option>
        </select>
        <select id="msort">
          <option value="relevance">按相关性</option>
          <option value="downloads">按下载量</option>
          <option value="follows">按关注数</option>
          <option value="newest">按最新发布</option>
          <option value="updated">按最近更新</option>
        </select>
      </div>
      <button class="btn btn-primary" id="mgo">搜索模组</button>
    </div>
    <div class="list" id="mlist"></div>
  </section>
</div>

<div class="mask" id="mask">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="shTitle">文件列表</h2>
      <button class="btn btn-sm" id="shClose">关闭</button>
    </div>
    <div id="shBody"></div>
  </div>
</div>

<script>
const MH='https://piston-meta.mojang.com/mc/game/version_manifest_v2.json';
const MR='https://api.modrinth.com/v2';
const TC={release:'正式版',snapshot:'快照',old_beta:'旧版Beta',old_alpha:'旧版Alpha'};
const $=s=>document.querySelector(s);
let ALL=[],LATEST={},TYPE='',KW='';
const MAXSHOW=60;

function setStatus(t,cls){
  const e=$('#status');
  e.textContent=t;
  e.className='status'+(cls?' '+cls:'');
}
function fmt(n){
  n=n||0;
  if(n>=1e8)return (n/1e8).toFixed(1)+' 亿';
  if(n>=1e4)return (n/1e4).toFixed(1)+' 万';
  return ''+n;
}
function fsize(b){
  const u=['B','KB','MB','GB'];
  let i=0;b=b||0;
  while(b>=1024&&i<u.length-1){b/=1024;i++;}
  return b.toFixed(1)+' '+u[i];
}
function esc(s){
  return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function dl(url,name){
  const a=document.createElement('a');
  a.href=url;a.target='_blank';a.rel='noopener';a.download=name||'';
  document.body.appendChild(a);a.click();a.remove();
}

async function boot(){
  try{
    const d=await (await fetch(MH)).json();
    ALL=d.versions;LATEST=d.latest;
    setStatus('已连接 Mojang 官方服务器，共 '+ALL.length+' 个版本','ok');
    renderQuick();renderTypes();renderVers();
  }catch(e){
    setStatus('连接官方服务器失败：'+e.message+'（请检查网络，或改用 Chrome / Edge 打开）','err');
  }
}

function renderQuick(){
  $('#quick').innerHTML=
    '<span class="chip" data-q="'+esc(LATEST.release)+'">最新正式版 '+esc(LATEST.release)+'</span>'+
    '<span class="chip" data-q="'+esc(LATEST.snapshot)+'">最新快照 '+esc(LATEST.snapshot)+'</span>';
}

function renderTypes(){
  const ts=['','release','snapshot','old_beta','old_alpha'];
  $('#vtypes').innerHTML=ts.map(t=>
    '<span class="chip'+(TYPE===t?' on':'')+'" data-t="'+t+'">'+
    (t?TC[t]:'全部')+'</span>').join('');
}

function renderVers(){
  const pool=ALL.filter(v=>(!TYPE||v.type===TYPE)&&(!KW||v.id.indexOf(KW)>=0));
  if(!pool.length){$('#vlist').innerHTML='<div class="empty">没有匹配的版本</div>';return;}
  const shown=pool.slice(0,MAXSHOW);
  $('#vlist').innerHTML=shown.map(v=>
    '<div class="card"><div class="card-head">'+
      '<div><div class="card-title">'+esc(v.id)+'</div>'+
      '<div class="card-meta">'+esc(TC[v.type]||v.type)+' · '+esc((v.releaseTime||'').slice(0,10))+'</div></div>'+
      '<div class="chips">'+
        '<button class="btn btn-sm" data-k="client" data-u="'+esc(v.url)+'" data-i="'+esc(v.id)+'">客户端</button>'+
        '<button class="btn btn-sm" data-k="server" data-u="'+esc(v.url)+'" data-i="'+esc(v.id)+'">服务端</button>'+
      '</div>'+
    '</div></div>').join('')+
    (pool.length>MAXSHOW?'<div class="empty">仅显示前 '+MAXSHOW+' 个，输入更具体的版本号可缩小范围</div>':'');
}

async function grab(url,kind,id){
  setStatus('正在解析 '+id+' 的下载地址…');
  try{
    const d=await (await fetch(url)).json();
    const f=(d.downloads||{})[kind];
    if(!f){setStatus('该版本没有 '+kind+' 文件','err');return;}
    dl(f.url,id+'-'+kind+'.jar');
    setStatus('已开始下载 '+id+' '+kind+'.jar（'+fsize(f.size)+'）','ok');
  }catch(e){
    setStatus('获取下载地址失败：'+e.message,'err');
  }
}

async function searchMods(){
  const L=$('#mloader').value,G=$('#mgame').value.trim(),C=$('#mcat').value,S=$('#msort').value;
  const facets=[['project_type:mod']];
  if(L)facets.push(['categories:'+L]);
  if(G)facets.push(['versions:'+G]);
  if(C)facets.push(['categories:'+C]);
  setStatus('正在搜索 Modrinth…');
  $('#mlist').innerHTML='<div class="empty">加载中…</div>';
  try{
    const q=new URLSearchParams({
      query:$('#mkw').value.trim(),facets:JSON.stringify(facets),index:S,limit:'20'
    });
    const d=await (await fetch(MR+'/search?'+q)).json();
    const hits=d.hits||[];
    setStatus('Modrinth 找到约 '+(d.total_hits||0)+' 个结果','ok');
    if(!hits.length){$('#mlist').innerHTML='<div class="empty">没有匹配的模组</div>';return;}
    $('#mlist').innerHTML=hits.map(h=>{
      const tags=(h.categories||[]).slice(0,5).map(c=>
        '<span class="tag mid">'+esc(c)+'</span>').join(' ');
      return '<div class="card"><div class="card-head">'+
        '<div><div class="card-title">'+esc(h.title)+'</div>'+
        '<div class="card-meta">'+esc(h.author)+' · 下载 '+fmt(h.downloads)+' · 关注 '+fmt(h.follows)+'</div></div>'+
        '<button class="btn btn-sm" data-mod="'+esc(h.slug)+'">查看文件</button></div>'+
        '<div class="card-meta" style="margin-top:var(--space-2)">'+esc(h.description)+'</div>'+
        '<div class="chips" style="margin-top:var(--space-3)">'+tags+'</div></div>';
    }).join('');
  }catch(e){
    setStatus('搜索失败：'+e.message,'err');
    $('#mlist').innerHTML='';
  }
}

async function openMod(slug){
  const L=$('#mloader').value,G=$('#mgame').value.trim();
  $('#mask').classList.add('on');
  $('#shTitle').textContent=slug;
  $('#shBody').innerHTML='<div class="empty">加载中…</div>';
  try{
    const q={};
    if(L)q.loaders=JSON.stringify([L]);
    if(G)q.game_versions=JSON.stringify([G]);
    const u=MR+'/project/'+encodeURIComponent(slug)+'/version?'+new URLSearchParams(q);
    const vers=await (await fetch(u)).json();
    if(!vers.length){$('#shBody').innerHTML='<div class="empty">没有符合当前筛选的文件</div>';return;}
    $('#shBody').innerHTML=vers.slice(0,20).map(v=>{
      const fs=v.files||[];
      const f=fs.filter(x=>x.primary)[0]||fs[0];
      if(!f)return '';
      return '<div class="file"><div>'+
        '<div class="file-n">'+esc(v.version_number)+' · '+esc(f.filename)+'</div>'+
        '<div class="file-s">'+esc((v.loaders||[]).join('/'))+' · '+
          esc((v.game_versions||[]).slice(0,3).join(', '))+' · '+fsize(f.size)+'</div>'+
        '</div><button class="btn btn-sm" data-f="'+esc(f.url)+'" data-fn="'+esc(f.filename)+'">下载</button></div>';
    }).join('');
  }catch(e){
    $('#shBody').innerHTML='<div class="empty">获取失败：'+esc(e.message)+'</div>';
  }
}

document.addEventListener('click',function(e){
  const t=e.target.closest('[data-t],[data-q],[data-k],[data-mod],[data-f]');
  if(!t)return;
  const d=t.dataset;
  if(d.t!==undefined){TYPE=d.t;renderTypes();renderVers();}
  else if(d.q!==undefined){KW=d.q;$('#vkw').value=d.q;renderVers();}
  else if(d.k){grab(d.u,d.k,d.i);}
  else if(d.mod){openMod(d.mod);}
  else if(d.f){dl(d.f,d.fn);setStatus('已开始下载 '+d.fn,'ok');}
});

document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});
    document.getElementById(b.dataset.p).classList.add('on');
  });
});

$('#vkw').addEventListener('input',function(e){KW=e.target.value.trim();renderVers();});
$('#mgo').addEventListener('click',searchMods);
$('#mkw').addEventListener('keydown',function(e){if(e.key==='Enter')searchMods();});
$('#shClose').addEventListener('click',function(){$('#mask').classList.remove('on');});
$('#mask').addEventListener('click',function(e){if(e.target.id==='mask')$('#mask').classList.remove('on');});

boot();
</script>
</body>
</html>
